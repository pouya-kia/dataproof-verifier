name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Show interpreter and runner
        run: |
          python --version
          uname -a
      - name: Install package and development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify installed import and distribution identity
        run: |
          python -c "import dataproof_verifier, tomllib; from importlib.metadata import version; expected=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert version('dataproof-verifier') == expected"
          dataproof-verifier --help
      - name: Ruff lint
        run: python -m ruff check .
      - name: Ruff format
        run: python -m ruff format --check .
      - name: Mypy strict source check
        run: python -m mypy src
      - name: Complete public test suite
        run: python -m pytest -q
      - name: Build Wheel and sdist
        run: python -m build --outdir dist
      - name: Verify distribution identity and entry point
        run: |
          python - <<'PY'
          from email.parser import BytesParser
          from pathlib import Path
          import tomllib
          from zipfile import ZipFile

          expected = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          assert wheels[0].name == f"dataproof_verifier-{expected}-py3-none-any.whl"
          assert (Path("dist") / f"dataproof_verifier-{expected}.tar.gz").is_file()
          with ZipFile(wheels[0]) as archive:
              names = archive.namelist()
              metadata_path = next(name for name in names if name.endswith(".dist-info/METADATA"))
              entry_points_path = next(
                  name for name in names if name.endswith(".dist-info/entry_points.txt")
              )
              metadata = BytesParser().parsebytes(archive.read(metadata_path))
              assert metadata["Name"] == "dataproof-verifier"
              assert metadata["Version"] == expected
              assert "dataproof-verifier = dataproof_verifier.cli:main" in archive.read(
                  entry_points_path
              ).decode()
              assert any(name.startswith("dataproof_verifier/") for name in names)
              assert not any(name.startswith("dataproof/") for name in names)
          PY
      - name: Install built Wheel and check CLI
        run: |
          python -m pip install --no-deps --force-reinstall dist/*.whl
          python -c "import dataproof_verifier, tomllib; from importlib.metadata import version; expected=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert version('dataproof-verifier') == expected"
          dataproof-verifier --help
      - name: Installed Wheel bounded JOIN replay
        run: |
          join_tmp="$(mktemp -d "$RUNNER_TEMP/dataproof-join.XXXXXX")"
          dataproof-verifier join preflight examples/join/fanout.json
          dataproof-verifier join check examples/join/fanout.json --output "$join_tmp/result"
          dataproof-verifier join replay "$join_tmp/result/witness.json"
          dataproof-verifier join preflight examples/join/left_missing_match.json
          dataproof-verifier join check examples/join/left_missing_match.json --output "$join_tmp/left"
          dataproof-verifier join replay "$join_tmp/left/witness.json"
          dataproof-verifier join preflight examples/join/string_distinct.json
          dataproof-verifier join check examples/join/string_distinct.json --output "$join_tmp/string"
          dataproof-verifier join replay "$join_tmp/string/witness.json"
          dataproof-verifier join preflight examples/join/right_missing_match.json
          dataproof-verifier join check examples/join/right_missing_match.json --output "$join_tmp/right"
          dataproof-verifier join replay "$join_tmp/right/witness.json"
      - name: Dependency consistency
        run: python -m pip check
